<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Departamento | Sol</title>
    <style>
      :root {
        --bg: #f7f3ee;
        --panel: #fffaf3;
        --primary: #d77d4b;
        --primary-dark: #a95d2a;
        --text: #1e2a2d;
        --muted: #5e6c71;
        --border: rgba(30, 42, 45, 0.08);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #f8f3ec 0%, #f2e7d9 100%);
        color: var(--text);
      }
      .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 20px 80px; }
      .header {
        display: flex; justify-content: space-between; align-items: center; gap: 16px;
        margin-bottom: 28px;
      }
      .brand { font-size: 1.8rem; font-weight: 700; }
      .brand span { color: var(--primary); }
      .btn {
        display: inline-block; padding: 12px 18px; border-radius: 999px; background: var(--primary);
        color: white; text-decoration: none; font-weight: 700;
      }
      .hero {
        display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 28px; align-items: center;
      }
      .hero img, .gallery img {
        width: 100%; display: block; border-radius: 20px; object-fit: cover;
      }
      .hero img { height: 420px; }
      .content {
        background: rgba(255,255,255,0.4); border: 1px solid var(--border); border-radius: 26px;
        padding: 28px;
      }
      .eyebrow {
        text-transform: uppercase; letter-spacing: 0.12em; font-size: 0.76rem; color: var(--primary-dark);
        font-weight: 700; margin: 0 0 8px;
      }
      h1 { margin: 0 0 14px; font-size: clamp(2rem, 4vw, 3.2rem); }
      p { color: var(--muted); line-height: 1.8; margin: 0 0 16px; }
      ul { margin: 0; padding-left: 18px; color: var(--text); line-height: 1.8; }
      .gallery {
        display: grid; grid-template-columns: repeat(3, minmax(180px, 1fr)); gap: 18px; margin-top: 34px;
      }
      .gallery img { height: 220px; }
      @media (max-width: 760px) {
        .hero { grid-template-columns: 1fr; }
        .gallery { grid-template-columns: 1fr 1fr; }
      }
      @media (max-width: 520px) {
        .header { flex-direction: column; align-items: flex-start; }
        .gallery { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="header">
        <div class="brand">Sol <span>Departamento</span></div>
        <a class="btn" href="../index.html">Volver</a>
      </div>

      <section class="hero">
        <img src="../../imagenes/departamento/entrada.jpeg" alt="Entrada al departamento" />
        <div class="content">
          <p class="eyebrow">Funcional</p>
          <h1>Departamento Buchalauquén</h1>
          <p>
            Un departamento cómodo y luminoso, con cocina equipada y espacios pensados para una estadía confortable cerca del mar.
          </p>
          <ul>
            <li>Cocina y comedor integrados</li>
            <li>Ubicación cercana a servicios</li>
            <li>Ideal para parejas o familias pequeñas</li>
          </ul>
        </div>
      </section>

      <div class="gallery">
        <img src="../../imagenes/departamento/comedor.jpeg" alt="Comedor" />
        <img src="../../imagenes/departamento/cocina.jpeg" alt="Cocina" />
        <img src="../../imagenes/departamento/cocina 2.jpeg" alt="Cocina 2" />
        <img src="../../imagenes/departamento/entrada 1.jpeg" alt="Entrada" />
        <img src="../../imagenes/departamento/vista para afuera.jpeg" alt="Vista exterior" />
        <img src="../../imagenes/departamento/baño.jpeg" alt="Baño" />
      </div>
    </div>
  </body>
</html>
